[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"app/data/*" = ["E501"]  # problem statements and test tables read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
