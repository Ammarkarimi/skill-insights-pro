# Production-like local stack: `cp .env.example .env`, fill in OPENAI_API_KEY, then `docker compose up --build`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skillsphere
      POSTGRES_PASSWORD: skillsphere
      POSTGRES_DB: skillsphere
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsphere"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://skillsphere:skillsphere@db:5432/skillsphere
      # Allow plain-http localhost when running this stack on your machine.
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
