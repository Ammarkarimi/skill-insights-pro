# Render Blueprint: one Docker web service (API + frontend) and a managed Postgres database.
# Create it from the Render dashboard: New > Blueprint > pick this repository.
# You are asked for the values marked `sync: false` once, when the Blueprint is created.
databases:
  - name: skillsphere-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: skillsphere
    user: skillsphere
    postgresMajorVersion: "17"

services:
  - type: web
    name: skillsphere
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # APP_URL defaults to the service's Render URL; set it once you add a custom domain.
      - key: DATABASE_URL
        fromDatabase:
          name: skillsphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: COMPANY_NAME
        sync: false
      # Email (any SMTP provider): needed for signup confirmation, password reset and reminders.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      # Add later in the dashboard when ready: PADDLE_*, RAZORPAY_*, TURNSTILE_*, GA_MEASUREMENT_ID,
      # GOOGLE_ADS_*, META_PIXEL_ID, SENTRY_DSN, ADZUNA_*, GITHUB_*. See .env.example.
